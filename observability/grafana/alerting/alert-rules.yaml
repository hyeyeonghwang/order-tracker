apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker-alerts
    folder: Order Tracker
    interval: 10s
    rules:
      - uid: ot-5xx-endpoint-alert
        title: "HTTP 5xx Server Error Detected"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum by (http_method, http_target, http_status_code) (
                  increase(http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m])
                )
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          service: order-tracker
        annotations:
          summary: "5xx on {{ $labels.http_method }} {{ $labels.http_target }}"
          description: >-
            Endpoint: {{ $labels.http_method }} {{ $labels.http_target }}
            (HTTP {{ $labels.http_status_code }}).
            Time window: 5m increase (pending for 1m before firing).
            5xx responses in window: {{ $values.B }}.
            Dashboard: http://localhost:3000/d/order-tracker-5xx/
          dashboard_url: "http://localhost:3000/d/order-tracker-5xx/"
          runbook_url: "http://localhost:3000/d/order-tracker-5xx/?viewPanel=3"
